const daysGrid = document.getElementById("daysGrid");
const hasRec = d => recordings[d] && recordings[d].length > 0 && recordings[d][0].title !== "";

function renderCards(filter=""){
    daysGrid.innerHTML = "";
    for(let day = 1; day <= 60; day++){
        if(!(`Day ${day}`.toLowerCase().includes(filter.toLowerCase()))) continue;
        const done = hasRec(day);
        const card = document.createElement("div");
        card.className = "day-card" + (done ? " has-rec" : "");
        const body = done
            ? recordings[day].map(r => `<a class="record-btn" href="${r.link}" target="_blank" rel="noopener">▶ ${r.title}</a>`).join("")
            : `<div class="empty">No Recording Yet</div>`;
        card.innerHTML = `<div class="day-title">Day ${day}</div>${body}`;
        daysGrid.appendChild(card);
    }
}

function toggleResources(){
    const open = document.getElementById("resourcesPanel").classList.toggle("open");
    document.querySelector(".resource-btn").setAttribute("aria-expanded", open);
}

renderCards();
document.getElementById("progress").textContent =
    `${Array.from({length:60},(_,i)=>i+1).filter(hasRec).length} of 60 days recorded`;

document.getElementById("searchInput").addEventListener("input", function(){
    renderCards(this.value);
});

// Cursor spotlight + 3D tilt (mouse only, skipped for reduced motion)
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
document.addEventListener("pointermove", e => {
    if(e.pointerType !== "mouse") return;
    const el = e.target.closest(".day-card, .resource-link, .links");
    if(!el) return;
    const r = el.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    el.style.setProperty("--mx", x + "px");
    el.style.setProperty("--my", y + "px");
    if(el.classList.contains("day-card") && !calm){
        el.style.setProperty("--ry", ((x / r.width) - .5) * 14 + "deg");
        el.style.setProperty("--rx", (.5 - (y / r.height)) * 14 + "deg");
    }
});
document.addEventListener("pointerout", e => {
    const el = e.target.closest(".day-card");
    if(el && !el.contains(e.relatedTarget)){
        el.style.removeProperty("--rx");
        el.style.removeProperty("--ry");
    }
});
